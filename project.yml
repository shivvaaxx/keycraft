name: Keycraft
options:
  bundleIdPrefix: app.keycraft
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  KeycraftCore:
    path: .
targets:
  Keycraft:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Info.plist", "Keycraft.entitlements"]
    dependencies:
      - package: KeycraftCore
        product: KeycraftCore
    settings:
      base:
        PRODUCT_NAME: Keycraft
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: app.keycraft.Keycraft
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/Keycraft.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        # The on-device model is macOS 26+; weak-linked so Keycraft still launches on macOS 14 and 15.
        OTHER_LDFLAGS: ["-weak_framework", "FoundationModels"]
schemes:
  Keycraft:
    build:
      targets:
        Keycraft: all
    run:
      config: Debug
